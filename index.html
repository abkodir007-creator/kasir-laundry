<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D1B3D">
<meta name="description" content="Kasir StarWash Laundry — jalan di tablet, bisa dipakai tanpa internet.">
<title>Kasir StarWash Laundry</title>
<!-- Penanda versi (?v=14) pada setiap berkas bukan hiasan: perangkat yang
     masih menyimpan versi lama meminta alamat yang belum pernah ada di
     simpanannya, jadi terpaksa mengambil versi baru dari jaringan. Tanpa ini
     ada HP yang bertahan di versi lama walau situsnya sudah diperbarui.
     Naikkan angkanya setiap kali berkas aplikasi berubah. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StarWash">
<link rel="stylesheet" href="assets/styles.css?v=14">
</head>
<body>

<div class="app">
  <aside class="nav">
    <div class="brand" id="brand"></div>
    <nav class="nav-list" id="navList">
      <button class="nav-item is-active" data-view="beranda"><span>🏠</span>Beranda</button>
      <button class="nav-item" data-view="kasir"><span>🧾</span>Kasir</button>
      <button class="nav-item" data-view="pesanan"><span>📋</span>Pesanan</button>
      <button class="nav-item" data-view="pelanggan"><span>👤</span>Pelanggan</button>
      <button class="nav-item" data-view="laporan"><span>📊</span>Laporan</button>
      <button class="nav-item" data-view="pengeluaran"><span>💸</span>Pengeluaran</button>
      <button class="nav-item" data-view="layanan"><span>🏷️</span>Layanan</button>
      <button class="nav-item" data-view="penggunaAkun"><span>🔑</span>Pengguna</button>
      <button class="nav-item" data-view="pengaturan"><span>⚙️</span>Pengaturan</button>
      <button class="nav-item" id="btnKunci" type="button"><span>🔒</span>Kunci</button>
    </nav>
    <div class="nav-foot">
      <div class="nav-user" id="navUser"></div>
      <span id="netStatus" class="pill pill-ok">Offline siap</span>
    </div>
  </aside>

  <main class="main" id="view"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="modal" id="modal">
  <form method="dialog" class="modal-inner" id="modalInner"></form>
</dialog>

<script src="vendor/firebase-app-compat.js?v=14"></script>
<script src="vendor/firebase-auth-compat.js?v=14"></script>
<script src="vendor/firebase-firestore-compat.js?v=14"></script>
<script src="js/merek.js?v=14"></script>
<script src="js/utils.js?v=14"></script>
<script src="js/awan.js?v=14"></script>
<script src="js/auth.js?v=14"></script>
<script src="js/db.js?v=14"></script>
<script src="js/receipt.js?v=14"></script>
<script src="js/views.js?v=14"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
