name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Bangun versi satu berkas agar bisa diunduh dari situs yang terbit:
      # https://<pengguna>.github.io/<repo>/dist/kasir-laundry.html
      - run: node tools/build-single.js
      # enablement: true menyalakan GitHub Pages sendiri jika belum aktif,
      # sehingga tidak perlu diatur manual lewat Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
